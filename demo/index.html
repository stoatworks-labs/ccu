  <body>
    <main id="demo">
      <noscript>
        <h1>CCU</h1>
        <p>
          An FFGL effect that runs a clip through a broadcast camera's
          processing chain with every knob out, in the camera's fixed order and
          in linear light: master gain, white balance with a slow drift, a
          matrix, detail from pixel and line delays with coring, level
          dependence and a skin window, a per-channel knee, gamma and black
          gamma, pedestal and white clip. All the looks of a badly set-up camera
          come out of that order rather than being drawn on: halos the width of
          the delay, grain sharpened by too little coring, faces gone soft while
          the jacket stays sharp, highlights going milky through the knee, and a
          warm white that clips in one channel first.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/ccu">its repository</a>.
        </p>
