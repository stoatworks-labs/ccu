name: ci

# Both platforms on every push and pull request, so a Dependabot bump has a
# status check to gate on and a GLEW-shaped break -- which macOS is
# structurally blind to, because macOS never links GLEW -- is caught before a
# tag. Both build the OpenFX plugin too (BUILD_OFX is on by default). There
# is no Linux job here: the FFGL half has no Linux path, and the OpenFX
# plugin's Linux build and load test live in release.yml, which a dispatch
# runs without publishing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 -- the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific.
        #
        # CCU_BUILD_TOOLS is ON here where the release build turns it
        # OFF: cctest is the only place the chain is written down as a
        # number, so compiling and running it is most of the value.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCCU_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Parameters
        # No GL needed, so this one cannot be a runner problem.
        run: ./build/cctest --list

      - name: Shaders
        # A GitHub macOS runner cannot create an accelerated GL context, so
        # this is where CI looks at the GLSL: every shader the plugin
        # compiles, through glslc, by the same script verify.sh runs.
        run: |
          brew install shaderc
          tools/check-shaders.sh build/cctest

      - name: Offline
        # --offline is every check that needs no GL -- the control laws
        # against their statements and the names -- and it says loudly what
        # it did not run.
        timeout-minutes: 10
        run: ./build/cctest --offline

      - name: Rendered
        # If the runner can make a software 4.1 context these run at 320x180,
        # the raster verify.sh also runs locally; if it cannot, --allow-no-gl
        # turns the failure into a loud SKIP rather than a red build that says
        # nothing about the plugin. Every check reads texels with integer
        # texelFetch and carries a tolerance derived per operation, so
        # nothing in them depends on a rasteriser's uv or a texture unit's
        # filtering; they always run on the dev Mac, in tools/verify.sh, at
        # 1280x720 as well.
        timeout-minutes: 25
        run: >
          ./build/cctest --identity --detail --coring --knee --gamma --order --skin
          --negative --cpu --size 320x180 --allow-no-gl

      - name: OpenFX CPU chain
        # --cpu above holds the OpenFX build's CPU copy of the two passes to
        # the GPU, and on a runner with no GL it SKIPs. This at least runs
        # that copy -- both passes, every resolution, threaded -- so a crash
        # or a hang in it cannot reach a tag. The numbers are a runner's and
        # mean nothing.
        timeout-minutes: 10
        run: ./build/cctest --bench-cpu --frames 2

      - name: OpenFX bundle
        # The bundle names its own binary in Info.plist, exports the OFX entry
        # point, and signs. The first is a release-time codesign failure with
        # no local symptom at all -- see cmake/InfoOFX.plist.in. Captured and
        # matched rather than piped into grep -q, which fails under pipefail
        # when grep FINDS its match.
        run: |
          bundle=build/CCU.ofx.bundle
          named=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$bundle/Contents/Info.plist")
          test -f "$bundle/Contents/MacOS/$named"
          echo "CFBundleExecutable is $named, and it is there"
          syms=$(nm -gU "$bundle/Contents/MacOS/$named")
          case "$syms" in
            *_OfxGetPlugin*) echo "exports OfxGetPlugin" ;;
            *) echo "no _OfxGetPlugin in $named"; exit 1 ;;
          esac
          cp -R "$bundle" "$RUNNER_TEMP/"
          codesign --force --sign - --timestamp=none "$RUNNER_TEMP/CCU.ofx.bundle"

      - name: Controls
        # At 160x90 and two at a time, because a software rasteriser is slow
        # and the question is only whether a control changed ANY subpixel.
        timeout-minutes: 25
        run: python3 tools/sweep.py --binary build/cctest --size 160x90 --jobs 2 --allow-no-gl

      # build/*.bundle takes CCU.ofx.bundle as well as the FFGL CCU.bundle.
      - uses: actions/upload-artifact@v7
        with:
          name: ccu-macos-arm64
          path: build/*.bundle
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        # The toolchain path MUST stay double-quoted: a `run:` step on Windows
        # is PowerShell, and unquoted this expands to nothing.
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DCCU_BUILD_TOOLS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: OpenFX plugin
        # Win64 output directories are pinned in CMakeLists.txt; a multi-config
        # generator otherwise drops the .ofx under Release/ and the bundle is
        # empty while the build reports success.
        shell: bash
        run: |
          test -f build/CCU.ofx.bundle/Contents/Win64/CCU.ofx
          ls -l build/CCU.ofx.bundle/Contents/Win64

      - uses: actions/upload-artifact@v7
        with:
          name: ccu-windows-x86_64
          path: |
            build/Release/*.dll
            build/CCU.ofx.bundle/Contents/Win64/CCU.ofx
          if-no-files-found: error
